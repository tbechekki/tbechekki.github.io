<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="56" height="56" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Trim Eagle logo: a bald eagle head in profile with a short taper fade haircut on a deep sea blue circle</title>
  <defs>
    <!-- the head shape, reused to keep the haircut inside it -->
    <clipPath id="head-clip">
      <path d="M26 100 L30 74 Q30 42 58 32 Q80 26 90 42 L92 52 Q84 60 84 72 L88 100 Z"/>
    </clipPath>
    <!-- the taper: hair stays full on top and fades out toward the neck -->
    <linearGradient id="taper" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="86">
      <stop offset="0" stop-color="#2b1d14"/>
      <stop offset="0.45" stop-color="#2b1d14"/>
      <stop offset="1" stop-color="#2b1d14" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="#0a4d68"/>
  <!-- head and neck feathers -->
  <path d="M26 100 L30 74 Q30 42 58 32 Q80 26 90 42 L92 52 Q84 60 84 72 L88 100 Z" fill="#e0f2e9"/>
  <!-- short haircut with a crisp hairline and a fade down the back -->
  <path d="M20 20 L100 20 L100 43 L88 43 L72 40 Q50 42 42 62 Q38 72 38 88 L20 88 Z" fill="url(#taper)" clip-path="url(#head-clip)"/>
  <!-- hooked beak -->
  <path d="M88 40 Q112 38 106 62 Q102 56 96 60 L90 56 Z" fill="#e9b44c"/>
  <!-- brow and eye -->
  <path d="M62 40 L82 46 L80 50 L62 46 Z" fill="#0a4d68"/>
  <circle cx="74" cy="51" r="3.2" fill="#0a4d68"/>
</svg>